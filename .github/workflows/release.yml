name: Release

# Push a tag like v1.2.3 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          # versionCode: 1.2.3 -> 10203 (must grow with every release)
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret SIGNING_KEYSTORE_BASE64 is missing (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew test assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify signature, checksum
        id: apk
        run: |
          APK="Blockwork-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          CERT=$(grep -m1 'SHA-256 digest' signer.txt | awk '{print $NF}')
          sha256sum "$APK" > "$APK.sha256"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Install:** download \`${{ steps.apk.outputs.file }}\` on your Android phone and open it –
          see the [installation guide](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md).

          Signing certificate SHA-256: \`${{ steps.apk.outputs.cert }}\`

          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Blockwork ${{ steps.version.outputs.name }}" \
            --notes-file notes.md --generate-notes --verify-tag
